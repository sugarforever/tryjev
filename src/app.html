<!doctype html>
<html lang="en" data-theme="candy">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Theme before first paint: ?theme= wins, then localStorage, default candy (see src/lib/theme.svelte.ts)
			try {
				var q = new URLSearchParams(location.search).get('theme'), s = localStorage.getItem('jev-theme');
				var t = q === 'swiss' || q === 'candy' ? q : s === 'swiss' || s === 'candy' ? s : 'candy';
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
